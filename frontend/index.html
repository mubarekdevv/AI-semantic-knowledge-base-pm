<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI Project Management</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'Roboto', 'Oxygen', 'Ubuntu', 'Cantarell', sans-serif;
            background: linear-gradient(135deg, #f5f7fa 0%, #c3cfe2 100%);
            min-height: 100vh;
            padding: 20px;
            color: #1a202c;
        }

        .container {
            max-width: 1200px;
            margin: 0 auto;
        }

        .header {
            margin-bottom: 40px;
            text-align: center;
        }

        .header h1 {
            font-size: 2.5rem;
            font-weight: 700;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            margin-bottom: 8px;
        }

        .header p {
            font-size: 1rem;
            color: #718096;
        }

        .sections {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 24px;
            margin-bottom: 24px;
        }

        @media (max-width: 768px) {
            .sections {
                grid-template-columns: 1fr;
            }

            .header h1 {
                font-size: 2rem;
            }
        }

        .card {
            background: white;
            border-radius: 12px;
            padding: 28px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.1);
            transition: all 0.3s ease;
            border: 1px solid rgba(0, 0, 0, 0.05);
        }

        .card:hover {
            box-shadow: 0 15px 40px rgba(0, 0, 0, 0.15);
            transform: translateY(-2px);
        }

        .card h2 {
            font-size: 1.25rem;
            font-weight: 600;
            margin-bottom: 20px;
            color: #1a202c;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .icon {
            width: 24px;
            height: 24px;
            font-size: 1.2rem;
        }

        .form-group {
            margin-bottom: 16px;
        }

        .form-group:last-child {
            margin-bottom: 0;
        }

        label {
            display: block;
            font-size: 0.875rem;
            font-weight: 500;
            margin-bottom: 6px;
            color: #4a5568;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        input, select {
            width: 100%;
            padding: 12px 14px;
            border: 1.5px solid #e2e8f0;
            border-radius: 8px;
            font-size: 1rem;
            font-family: inherit;
            transition: all 0.2s ease;
            background: #f8fafc;
        }

        input:focus, select:focus {
            outline: none;
            border-color: #667eea;
            background: white;
            box-shadow: 0 0 0 3px rgba(102, 126, 234, 0.1);
        }

        button {
            width: 100%;
            padding: 12px 16px;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            border: none;
            border-radius: 8px;
            font-size: 1rem;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s ease;
            text-transform: uppercase;
            letter-spacing: 0.5px;
            margin-top: 8px;
        }

        button:hover {
            transform: translateY(-2px);
            box-shadow: 0 10px 20px rgba(102, 126, 234, 0.3);
        }

        button:active {
            transform: translateY(0);
        }

        .results-section {
            grid-column: 1 / -1;
        }

        .results-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(300px, 1fr));
            gap: 16px;
            margin-top: 20px;
        }

        .task-card {
            background: linear-gradient(135deg, #f5f7fa 0%, #c3cfe2 0.1);
            border: 1.5px solid #e2e8f0;
            border-radius: 10px;
            padding: 20px;
            transition: all 0.3s ease;
            cursor: default;
        }

        .task-card:hover {
            border-color: #667eea;
            box-shadow: 0 8px 20px rgba(102, 126, 234, 0.15);
            background: linear-gradient(135deg, #f5f7fa 0%, #e0e7ff 0.1);
        }

        .task-field {
            margin-bottom: 14px;
        }

        .task-field:last-child {
            margin-bottom: 0;
        }

        .task-label {
            font-size: 0.75rem;
            font-weight: 600;
            color: #718096;
            text-transform: uppercase;
            letter-spacing: 0.5px;
            margin-bottom: 4px;
            display: block;
        }

        .task-value {
            font-size: 1rem;
            font-weight: 500;
            color: #1a202c;
            padding: 8px 12px;
            background: white;
            border-radius: 6px;
            border-left: 3px solid #667eea;
        }

        .status-pending {
            background: #fef3c7;
            color: #92400e;
            padding: 4px 12px;
            border-radius: 6px;
            display: inline-block;
            font-size: 0.875rem;
            font-weight: 600;
        }

        .status-done {
            background: #d1fae5;
            color: #065f46;
            padding: 4px 12px;
            border-radius: 6px;
            display: inline-block;
            font-size: 0.875rem;
            font-weight: 600;
        }

        .reasoning-box {
            background: linear-gradient(135deg, #e0e7ff 0%, #f0f4ff 100%);
            border-left: 4px solid #667eea;
            border-radius: 8px;
            padding: 16px;
            margin: 16px 0;
            color: #3730a3;
        }

        .reasoning-label {
            font-size: 0.875rem;
            font-weight: 600;
            text-transform: uppercase;
            letter-spacing: 0.5px;
            margin-bottom: 8px;
            color: #4c1d95;
        }

        .reasoning-text {
            font-size: 0.95rem;
            line-height: 1.6;
            color: #3730a3;
        }

        .empty-state {
            text-align: center;
            padding: 40px 20px;
            color: #a0aec0;
        }

        .empty-state svg {
            width: 64px;
            height: 64px;
            margin-bottom: 16px;
            opacity: 0.3;
        }

        .empty-state p {
            font-size: 1rem;
        }
    </style>
</head>
<body>

<div class="container">

    <!-- Header -->
    <div class="header">
        <h1>✨ AI Project Manager</h1>
        <p>Manage tasks and get AI-powered insights</p>
    </div>

    <!-- Main Sections -->
    <div class="sections">

        <!-- Add Task Form -->
        <div class="card">
            <h2><span class="icon">➕</span> Add Task</h2>
            <form id="taskForm">
                <div class="form-group">
                    <label for="taskName">Task Name</label>
                    <input type="text" id="taskName" placeholder="Enter task name..." required>
                </div>
                <div class="form-group">
                    <label for="projectName">Project</label>
                    <input type="text" id="projectName" placeholder="Enter project name..." required>
                </div>
                <div class="form-group">
                    <label for="deadline">Deadline</label>
                    <input type="date" id="deadline" required>
                </div>
                <div class="form-group">
                    <label for="status">Status</label>
                    <select id="status">
                        <option value="pending">⏳ Pending</option>
                        <option value="done">✓ Done</option>
                    </select>
                </div>
                <button type="submit">Add Task</button>
            </form>
        </div>

        <!-- Ask AI -->
        <div class="card">
            <h2><span class="icon">🤖</span> Ask AI</h2>
            <div class="form-group">
                <label for="questionInput">Your Question</label>
                <input type="text" id="questionInput" placeholder="Ask anything about your tasks...">
            </div>
            <button id="askBtn">Get AI Insight</button>
        </div>

    </div>

    <!-- Results Section -->
    <div class="card results-section">
        <h2><span class="icon">📊</span> Results</h2>
        <div id="results" class="results-grid">
            <div class="empty-state">
                <p>No results yet. Add a task or ask a question to get started.</p>
            </div>
        </div>
    </div>

</div>

<script>
    const API_URL = "http://localhost:5000";

    // Add Task
    document.getElementById("taskForm").addEventListener("submit", async function(e) {
        e.preventDefault();

        const data = {
            name: document.getElementById("taskName").value,
            project: document.getElementById("projectName").value,
            deadline: document.getElementById("deadline").value,
            status: document.getElementById("status").value
        };

        try {
            const res = await fetch(`${API_URL}/task`, {
                method: "POST",
                headers: {
                    "Content-Type": "application/json"
                },
                body: JSON.stringify(data)
            });

            const result = await res.json();
            alert("Task added successfully!");
            document.getElementById("taskForm").reset();

        } catch (err) {
            console.error(err);
            alert("Error adding task");
        }
    });

    // Ask AI
    document.getElementById("askBtn").addEventListener("click", async function() {
        const question = document.getElementById("questionInput").value;

        if (!question.trim()) {
            alert("Please enter a question");
            return;
        }

        const askBtn = document.getElementById("askBtn");
        const originalText = askBtn.textContent;
        askBtn.textContent = "Thinking...";
        askBtn.disabled = true;

        try {
            const res = await fetch(`${API_URL}/query`, {
                method: "POST",
                headers: {
                    "Content-Type": "application/json"
                },
                body: JSON.stringify({ question })
            });

            const data = await res.json();
            displayResults(data);
            document.getElementById("questionInput").value = "";

        } catch (err) {
            console.error(err);
            alert("Error fetching answer. Make sure your API server is running at http://localhost:5000");
        } finally {
            askBtn.textContent = originalText;
            askBtn.disabled = false;
        }
    });

    // Allow Enter key to submit question
    document.getElementById("questionInput").addEventListener("keypress", function(e) {
        if (e.key === "Enter") {
            document.getElementById("askBtn").click();
        }
    });

    // Display Results
    function displayResults(data) {
        const container = document.getElementById("results");
        container.innerHTML = "";

        if (Array.isArray(data)) {
            if (data.length === 0) {
                container.innerHTML = '<div class="empty-state"><p>No tasks found.</p></div>';
                return;
            }

            data.forEach(item => {
                let statusClass = "status-pending";
                let statusText = "⏳ Pending";

                if (item.status === "done") {
                    statusClass = "status-done";
                    statusText = "✓ Done";
                } else if (item.status === "delayed") {
                    statusClass = "status-delayed";
                    statusText = "⚠️ Delayed";
                }

                const div = document.createElement("div");
                div.className = "task-card";

                div.innerHTML = `
                    <div class="task-field">
                        <span class="task-label">Task</span>
                        <div class="task-value">${item.name || "N/A"}</div>
                    </div>
                    <div class="task-field">
                        <span class="task-label">Project</span>
                        <div class="task-value">${item.project || "N/A"}</div>
                    </div>
                    <div class="task-field">
                        <span class="task-label">Deadline</span>
                        <div class="task-value">${item.deadline || "N/A"}</div>
                    </div>
                    <div class="task-field">
                        <span class="task-label">Status</span>
                        <span class="${statusClass}">${statusText}</span>
                    </div>
                `;

                container.appendChild(div);
            });
        } else if (typeof data === "object" && data !== null) {
            // Handle reasoning and other object responses
            let html = "";

            if (data.reasoning) {
                html += `
                    <div class="reasoning-box">
                        <div class="reasoning-label">🧠 AI Reasoning</div>
                        <div class="reasoning-text">${data.reasoning}</div>
                    </div>
                `;
            }

            if (data.answer) {
                html += `
                    <div class="reasoning-box">
                        <div class="reasoning-label">💡 Answer</div>
                        <div class="reasoning-text">${data.answer}</div>
                    </div>
                `;
            }

            if (data.message) {
                html += `
                    <div class="reasoning-box">
                        <div class="reasoning-label">📝 Response</div>
                        <div class="reasoning-text">${data.message}</div>
                    </div>
                `;
            }

            if (!html) {
                html = `<div class="reasoning-box"><div class="reasoning-text">${JSON.stringify(data)}</div></div>`;
            }

            container.innerHTML = html;
        } else {
            container.innerHTML = `<div class="reasoning-box"><div class="reasoning-text">${JSON.stringify(data)}</div></div>`;
        }
    }
</script>

</body>
</html>
